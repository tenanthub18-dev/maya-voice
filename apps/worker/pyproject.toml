[project]
name = "voice-receptionist-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pipecat-ai[google,silero,soniox,webrtc,websocket]==1.14.0",
    "pyyaml==6.0.3",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]
