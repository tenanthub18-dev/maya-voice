name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Release: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Release: https://github.com/actions/setup-node/releases/tag/v7.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      # Release: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Release: https://github.com/actions/setup-python/releases/tag/v7.1.0
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      # Release: https://github.com/astral-sh/setup-uv/releases/tag/v10.3.2
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit

      - name: Test
        run: uv run pytest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Release: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Release: https://github.com/gitleaks/gitleaks-action/releases/tag/v3.0.0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3.0.0

  codeql:
    name: CodeQL
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      # Release: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Release: https://github.com/github/codeql-action/releases/tag/v4.39.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: javascript-typescript,python
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.1
